[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_port = COM9
monitor_echo = yes
monitor_eol = LF
upload_port = COM9

; Active test configuration: D13 is normally HIGH and each TRIGGER command
; drives it LOW for 2 seconds. The ESP32 GPIO high level is nominally 3.3 V.
build_flags =
    -D ENABLE_BNC_OUTPUT=1
    ; D13 on the common ESP32 DevKit V1 silkscreen maps to GPIO 13.
    -D TRIGGER_PIN=13
    -D TRIGGER_ACTIVE_HIGH=0
    -D PULSE_WIDTH_US=2000000
