[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; USB is used only to upload firmware and inspect debug messages during this
; first network test. The operational computer connection is TCP over Wi-Fi.
monitor_speed = 115200
monitor_port = COM3
monitor_eol = LF
upload_port = COM3

build_flags =
    -D TRIGGER_PIN=13
    -D TRIGGER_ACTIVE_HIGH=0
    -D PULSE_WIDTH_MS=2000
